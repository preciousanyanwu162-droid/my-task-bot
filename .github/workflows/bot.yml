name: Keep Bot Alive
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install library
        run: pip install -r requirements.txt
      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
